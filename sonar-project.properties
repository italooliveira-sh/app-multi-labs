# Identificação do projeto no SonarCloud
sonar.projectKey=italooliveira-sh_app-multi-labs
sonar.organization=italooliveira-sh
sonar.projectName=app-multi-labs

# Linguagem principal
sonar.language=java

# Localização do código fonte
sonar.sources=src/main/java

# Localização dos testes
sonar.tests=src/test/java

# Inclusão dos arquivos gerados pelo JaCoCo
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Para ignorar arquivos compilados
sonar.exclusions=**/build/**

# Para ignorar testes nas métricas de código
sonar.test.exclusions=**/src/test/**
